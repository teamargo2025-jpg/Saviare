name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  # Desde que el sitio se prerenderiza, el HTML publicado es una foto de lo que
  # habia en Supabase durante el build. Un producto nuevo o un precio corregido
  # desde el panel no llegan a Google hasta la siguiente publicacion, y sin esto
  # solo habria publicacion cuando alguien empuja codigo.
  # 09:00 UTC son las 04:00 en Peru: se reconstruye de madrugada.
  # Ojo: GitHub desactiva los cron de repos sin actividad durante 60 dias; si el
  # sitio deja de actualizarse solo, mirar primero si el workflow esta pausado.
  # Para publicar en el momento, usar "Run workflow" (workflow_dispatch).
  schedule:
    - cron: '0 9 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
